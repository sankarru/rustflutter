name: android-arm64-apk

# Builds one rustflutter example as an arm64-v8a APK, entirely from source, and
# uploads it as a workflow artifact. Which example is a workflow_dispatch input;
# a push builds counter.
#
# There is no prebuilt engine to lean on here. `flutter/rust/ffi` implements the
# 102 `rf_*` entry points the Rust framework links against, and
# `flutter/runtime/rust_app_interface.cc` is a rebuilt RuntimeController -- both
# are changes to engine C++ that no published artifact contains. Flutter only
# publishes engine artifacts for commits that exist in flutter/flutter, and this
# fork's commits do not. So gn + ninja compiles the engine every time.
#
# The Android SDK is not installed either: DEPS fetches it over CIPD into
# flutter/third_party/android_tools/sdk, which is the path
# build/config/android/config.gni defaults android_sdk_root to.

on:
  workflow_dispatch:
    inputs:
      example:
        description: Which example to package
        type: choice
        default: counter
        options:
          - counter
          - cursor_demo
          - exit_demo
          - flutter_gallery
          - gallery
          - hello_world
          - platform_channels
          - settings_demo
          - showcase
          - text_demo
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  apk:
    name: ${{ inputs.example || 'counter' }}.apk (arm64-v8a)
    runs-on: ubuntu-latest
    # A cold engine build is long. 330 is under the 360 GitHub enforces.
    timeout-minutes: 330
    env:
      # Empty on a push, where workflow_dispatch inputs do not exist.
      EXAMPLE: ${{ inputs.example || 'counter' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ccache bakes absolute paths into its hash. The workspace and the
      # buildtools under it land at a different path on every runner, so
      # without this every run is a miss against the previous one.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: "5G"
      # ccache 4.x has no CCACHE_COMPRESS; the knob is CCACHE_NOCOMPRESS.
      #
      # CCACHE_COMPILERCHECK=content is the load-bearing one. By default ccache
      # hashes the compiler binary's size and mtime, and DEPS downloads a fresh
      # clang into src/flutter/buildtools on every runner -- different mtime each
      # time, so every object looks like it came from a different compiler and
      # nothing ever hits. Hashing content instead is what Chromium's own CI does.
      CCACHE_COMPILERCHECK: "content"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # build_apks.py needs a JDK for javac, d8 and apksigner.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # rust.gni resolves `rustc` off PATH and passes --edition 2024 to every
      # crate. 1.93.0 is the version the README records as verified; stable has
      # moved on since and nothing here has been re-checked against it.
      #
      # The target's std has to be installed explicitly. GN calls rustc with
      # --target=aarch64-linux-android directly rather than going through cargo,
      # so there is no manifest anywhere to trigger the download, and the build
      # stops at [2/5272] with "can't find crate for `std`" without this.
      - name: Set up rustc
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android

      # The runner ships toolchains this build has no use for. Reclaiming them
      # matters: the gclient sync and the build together want more disk than a
      # stock runner has free.
      #
      # /usr/local/lib/android goes because the SDK this build uses comes from
      # CIPD into the workspace, not from there. $AGENT_TOOLSDIRECTORY does NOT
      # go: setup-java installed the JDK into it, and build_apks.py needs that
      # javac for d8 and apksigner.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Set up ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version | head -1
          ccache --set-config=max_size="$CCACHE_MAXSIZE"

      # Restores a warm compiler cache from previous runs. Keyed on DEPS and the
      # workflow itself, so a dependency bump correctly throws it away.
      #
      # Only ccache is cached, deliberately: `src/out` is the larger and much
      # better prize for an incremental build, but it exceeds the 10GB ceiling
      # actions/cache puts on a single entry, and an entry that cannot upload
      # fails the step. ccache is bounded by CCACHE_MAXSIZE above and restores
      # the expensive part -- the clang invocations -- which leaves ninja only
      # the links.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('DEPS', '.github/workflows/android-apk.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      # depot_tools ships its `ninja` and `gn` shims, so putting it on PATH is
      # enough to make `ninja` below resolve to them -- which is why they have
      # to be bootstrapped first. Without this the build dies immediately with
      # "python3_bin_reldir.txt not found".
      - name: Bootstrap depot_tools
        run: update_depot_tools --no-registry

      # --no-history keeps this to the working tree rather than full clones,
      # which is the difference between a sync that fits on the runner and one
      # that does not. The build reads sources, not history.
      - name: gclient sync
        run: |
          cp tools/gclient.template .gclient
          gclient sync --no-history --nohooks
          gclient runhooks

      - name: gn gen
        run: |
          cd src
          vpython3 flutter/tools/gn \
            --android \
            --android-cpu arm64 \
            --runtime-mode=release \
            --no-lto \
            --no-prebuilt-dart-sdk \
            --no-goma \
            --no-rbe \
            --ccache

      # --no-lto above is what keeps this linkable in one CI job; the Android
      # engine is large and LTO on top of a cold build is the slowest thing in
      # the whole flow. One example target, not the whole engine.
      - name: ninja
        run: ninja -C src/out/android_release_arm64 "flutter/rust/examples/$EXAMPLE"

      # Packaging picks the platform and build-tools out of the CIPD SDK, since
      # make_apk.py's own defaults (android-36.1, 36.0.0) are not the ones
      # config.gni builds the engine against. Listed here because "No android.jar
      # at .../platforms/android-36.1" is otherwise the only clue.
      - name: Package APKs
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/src/flutter/third_party/android_tools/sdk
        run: |
          echo "packaging $EXAMPLE"
          ls -la src/out/android_release_arm64/*.so
          ls src/flutter/third_party/android_tools/sdk/platforms/
          ls src/flutter/third_party/android_tools/sdk/build-tools/
          python3 src/flutter/rust/host/tools/build_apks.py --out src/out/android_release_arm64
          ls -la src/out/android_release_arm64/apk/

      - name: Report ccache
        if: always()
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.example || 'counter' }}-apk-arm64
          path: src/out/android_release_arm64/apk/*.apk
          if-no-files-found: error
          retention-days: 14
