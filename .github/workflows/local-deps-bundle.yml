name: local-deps-bundle

# Makes an engine build possible on a machine that cannot afford one.
#
#   engine-deps-<hash>.tar.zst   everything DEPS creates -- third_party, the
#                                CIPD toolchains, gn, ninja, skia, icu, angle,
#                                harfbuzz. Fetching this is a file copy; running
#                                `gclient sync` for it is a 13 GB negotiation
#                                with every upstream.
#   engine-ccache-<hash>.tar.zst a ccache warmed by a linux-arm64 host build, so
#                                that a local `ninja` hits cache instead of
#                                compiling 5272 targets from nothing.
#
# This builds nothing that ships. It is a distribution mechanism for inputs.
#
# ## Why an arm runner
#
# ccache keys an object on the compiler binary itself -- its content hash, plus
# every flag and the preprocessed source. DEPS ships a separate clang per host
# CPU (`buildtools/linux-x64/clang`, `buildtools/linux-arm64/clang`), so a
# ccache warmed on an x64 runner cannot produce a single hit on an arm64
# machine. Hence `ubuntu-24.04-arm`.
#
# ## Why an Android configuration
#
# It warms the same configuration a local build runs. A host build would key
# the cache on a different set of flags and hand back one that misses on every
# edge that matters.
#
# Which needs an NDK at a hardcoded path:
#
#   build/config/android/config.gni:59
#     android_ndk_root = "//flutter/third_party/android_tools/sdk/ndk/28.2.13676358"
#
# inside the DEPS tree, and `DEPS:27` populates that tree only on macOS or
# linux-x64:
#
#   'download_android_deps': 'host_os == "mac" or
#                            (host_os == "linux" and host_cpu == "x64")'
#
# Widening that condition to arm64 does not help -- there is no arm64 package
# to widen it to. `cipd ensure` answers:
#
#   failed to resolve flutter/android/sdk/all/linux-arm64@version:37v2:
#     no such package: flutter/android/sdk/all/linux-arm64
#   failed to resolve perfetto/trace_to_text/linux-arm64@git_tag:v25.0:
#     no such package: perfetto/trace_to_text/linux-arm64
#
# and Google's CDN serves NDKs under release names (r26b, r28c) and not under
# the build numbers Flutter pins, so "just download 28.2.13676358" is not
# available either. `tools/local_android_ndk.sh` bridges the two: it stands a
# tree of symlinks at the path gn hardcodes, pointing at whichever NDK it is
# given. This workflow gives it r28b, because
# `android_ndk_clang_version = "19"` (config.gni:128) and r28b is the NDK whose
# compiler runtime is clang 19.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'DEPS'
      - 'tools/gclient.template'
      - '.github/workflows/local-deps-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    name: DEPS tree + warm host ccache
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 480
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The reason a restored ccache scored 0/4560 on its first outing: ccache
      # keys the compiler on size and mtime by default, and DEPS unpacks a
      # fresh clang every run, so every object looked like it came from a
      # different compiler. Chromium's own CI sets this for the same reason.
      CCACHE_COMPILERCHECK: "content"
      CCACHE_MAXSIZE: "8G"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up rustc
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android

      - name: Report runner
        run: |
          uname -a
          nproc
          free -g
          df -h /

      # Room for the 13 GB tree, the compressed copy of it, and a host build.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version | head -1
          ccache --set-config=max_size="$CCACHE_MAXSIZE"

      - name: Set up depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      # depot_tools' ninja and gn are shims that refuse to run unbootstrapped.
      - name: Bootstrap depot_tools
        run: update_depot_tools --no-registry

      # Unmodified. On an arm64 host `download_android_deps` is false, which
      # means android_tools and the NDK are absent. Editing DEPS to widen the
      # condition is not the fix; the packages it would ask for do not exist:
      #
      #   failed to resolve flutter/android/sdk/all/linux-arm64: no such package
      #   failed to resolve perfetto/trace_to_text/linux-arm64: no such package
      #
      # The NDK comes from Google's CDN instead (next step).
      - name: gclient sync
        run: |
          cp tools/gclient.template .gclient
          gclient sync --no-history --nohooks
          gclient runhooks

      # Chromium's arm64 host sysroot, which the build asserts on
      # (build/config/sysroot.gni:35) and which neither DEPS nor gclient
      # installs here:
      #
      #   ERROR at //build/config/sysroot.gni:35:5 (//build/toolchain/linux:clang_arm64)
      #     Missing sysroot (../../build/linux/debian_bullseye_arm64-sysroot)
      #
      # It lives under `src/build`, which is the repository's own directory, so
      # it is not part of the bundle either -- which is why a machine that only
      # untars the deps has to run this too.
      - name: Install the arm64 host sysroot
        run: |
          set -eux
          python3 src/build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          du -sh src/build/linux/debian_bullseye_arm64-sysroot

      # Packed immediately after the sync, before anything that can fail. An earlier
      # version packed it at the end, and an NDK step that failed took the whole
      # bundle down with it -- which is the one outcome this job cannot have,
      # because it is the only artifact here that cannot be produced another
      # way. Everything after this point is best-effort.
      - name: Pack the DEPS tree
        if: always()
        run: |
          set -eux
          time tar -I 'zstd -12 -T0 -q' -cf engine-deps.tar.zst \
            --exclude='.git' \
            src/third_party \
            src/flutter/third_party \
            src/flutter/buildtools \
            .gclient
          ls -la engine-deps.tar.zst
          df -h /

      # What landed, and how big. The compression ratio is not uniform: a
      # directory of jars or prebuilt clang will not shrink, one of sources
      # roughly halves. This is how a bundle that is "13 GB" becomes 1.2 GB,
      # and it is the only way to know that without shipping it first.
      - name: Report what DEPS fetched
        run: |
          df -h /
          du -sh src/third_party src/flutter/third_party src/flutter/buildtools 2>/dev/null
          echo "--- largest 25 under the DEPS roots ---"
          du -sm src/third_party/* src/flutter/third_party/* src/flutter/buildtools/* 2>/dev/null \
            | sort -rn | head -25
          echo "--- the arm64 toolchain this ccache will key on ---"
          ls src/flutter/buildtools/linux-arm64/ 2>/dev/null
          src/flutter/buildtools/linux-arm64/clang/bin/clang --version 2>/dev/null | head -1
          echo "--- and the SDK that is deliberately absent on arm64 ---"
          ls -d src/flutter/third_party/android_tools 2>/dev/null \
            || echo "android_tools: absent (DEPS:27 gates it to mac/linux-x64)"

      # A host linux-arm64 configuration. Not the Android one, and the reason is
      # worth recording because it cost a run to find out.
      #
      # The Android configuration needs an NDK, and gn reaches for
      # `prebuilt/linux-x86_64` even on an arm64 host (config.gni:29 maps every
      # host CPU to "x86_64"). Google builds NDKs whose tools in that directory
      # are x86_64 binaries:
      #
      #   $ ./tools/local_android_ndk.sh /tmp/ndk/android-ndk-r28b
      #   prebuilt : .../prebuilt/linux-x86_64  (config.gni: android_host_arch=x86_64)
      #   that clang will not run on this host
      #
      # So an arm64 runner cannot build the Android configuration with any NDK
      # it can obtain, and the x64 Android build that can (`android-shared-engine`)
      # keys its ccache on `buildtools/linux-x64/clang`, which shares nothing
      # with this machine. There is no cache a CI runner can hand this box that
      # would serve an Android build here.
      #
      # A host build needs no NDK, and it is the configuration whose C++ is the
      # same C++ -- flow/compositing_context.cc, the shell's platform-view
      # delegate, the rf_* FFI, none of which are platform-specific. A host
      # build also runs the engine's gtests, which an Android cross build never
      # does. What it cannot do is produce a shippable .so; that stays
      # android-shared-engine's job, and it is already fast.
      - name: gn gen (host)
        run: |
          cd src
          vpython3 flutter/tools/gn \
            --linux \
            --linux-cpu arm64 \
            --runtime-mode=release \
            --target-dir=linux_release_arm64 \
            --no-lto \
            --no-prebuilt-dart-sdk \
            --no-goma \
            --no-rbe \
            --ccache

      # Allowed to fail, and that is deliberate. The ccache is the part that can
      # be regenerated and the part most likely to hit a fresh toolchain
      # problem; the DEPS bundle above is the part that cannot be produced any
      # other way. Letting this fail the job would throw the bundle away with
      # it, which is the trade the previous version of this workflow made badly.
      - name: ninja (warms ccache)
        continue-on-error: true
        run: |
          ninja -C src/out/linux_release_arm64 flutter/rust:rustflutter_engine || true
          ccache --show-stats || true

      - name: Pack ccache
        if: always()
        run: |
          set -eux
          du -sh .ccache || true
          ccache -s || true
          # Whatever landed is what ships. An empty or missing ccache must not
          # fail this step, or a runner that could not build takes the deps
          # bundle down with it.
          if [ -d .ccache ] && [ -n "$(ls -A .ccache 2>/dev/null)" ]; then
            time tar -I 'zstd -6 -T0 -q' -cf engine-ccache.tar.zst .ccache
            ls -la engine-ccache.tar.zst
          else
            echo "no ccache to pack -- the ninja step above did not produce one"
            tar -I 'zstd -6 -T0 -q' -cf engine-ccache.tar.zst --files-from /dev/null
          fi

      - name: Report
        if: always()
        run: |
          ccache --show-stats || true
          ls -la *.tar.zst || true
          df -h /

      # compression-level: 0. Both payloads are already zstd, and upload-artifact
      # would spend minutes re-compressing them into a slightly smaller file
      # that takes longer to download -- the one thing this workflow exists to
      # avoid.
      #
      # if: always() on both. Every step between the sync and here can fail --
      # one of them did, and it cost a 1.2 GB bundle that took eight minutes to
      # produce and eleven to download. The artifacts are the job's output; a
      # later step's failure is not a reason to withhold them.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-deps-${{ hashFiles('DEPS', 'tools/gclient.template') }}
          path: engine-deps.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-ccache-${{ hashFiles('DEPS', 'tools/gclient.template') }}
          path: engine-ccache.tar.zst
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30