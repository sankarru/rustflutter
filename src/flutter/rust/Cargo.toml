# Cargo workspace for the Rust side of the engine.
#
# `rustflutter/` is the framework crate. It is the only Cargo package in this
# tree: the applications under `examples/` and the engine itself are GN targets
# built by ninja, not Cargo packages, so they are deliberately not members.
# Nothing here changes what GN compiles -- GN reads `rustflutter/BUILD.gn` and
# never looks at this file.
#
# Applications that live outside this repository (see `rustflutter create`) are
# ordinary Cargo projects and are not members either; they depend on the
# framework by path and bring their own lockfile.

cargo-features = ["codegen-backend"]

[workspace]
members = ["rustflutter", "apps/*"]
# The framework crate is edition 2024, so resolver v3.
resolver = "3"

# sccache (the `rustc-wrapper` in `.cargo/config.toml`) refuses incremental
# compilation, so every profile here opts out. Cranelift reaches much of its
# parallelism through codegen-units rather than through `-j`, and the framework
# crate is one very large crate -- 256 units is what makes a cold build bearable.
[profile.dev]
codegen-units = 256
incremental = false

# For iterating the Rust half against a device: the framework is compiled with
# opt-level=1 when it is built as a *dependency*, which is every app build.
#
# Opt-level 0 is right for a test binary and wrong for an app whose frames have
# to keep up; opt-level 3 spends minutes per rebuild. One is the middle, and
# `debug = 1` keeps line numbers so a backtrace from a device names lines.
#
# Scoped to `package."*"` deliberately. That key covers dependencies only, never
# the root package, so the two commands land where each wants to be:
#
#   cargo build -p photo_scroller   rustflutter is a dependency  -> opt-level=1
#   cargo test  -p rustflutter      rustflutter is the root      -> opt-level=0
#
# Without the scoping the test suite would pay opt-level=1 to compile the very
# large crate whose 6995 tests run in about a second.
#
# This is the `dev` profile rather than a separate one because `acs` has no
# `--profile` flag: it passes `--release` or nothing at all. A profile named
# `thin` would therefore be unreachable by the packaging tool, which would keep
# staging whatever `dev` last produced -- so `dev` itself is the thin build.
#
# LLVM, not Cranelift: see `[profile.cl]` below. That one miscompiles panic
# recovery, which is a real bug rather than a slow build.
[profile.dev.package."*"]
opt-level = 1
debug = 1

# Cranelift, as an opt-in profile rather than the `dev` default.
#
# It is not the default because it miscompiles this crate's panic handling: the
# three `framework::tests` cases about a panicking `build` -- a
# component_that_always_panics_stays_bounded,
# a_panicking_build_is_replaced_and_the_frame_finishes,
# a_retried_build_recovers_the_subtree -- let the panic escape the
# `catch_unwind` at `rustflutter/src/framework.rs:2565` instead of being caught
# by it. All three pass under LLVM and all three fail here. Recovering from a
# panicking component is a guarantee the framework makes, so it is not something
# to trade for build time without deciding that deliberately.
#
# Worth knowing: it compiles clean and the other 6992 tests pass, so a build that
# only cross-compiles to Android (which never runs the test suite) will not
# surface this. Use it for fast iteration on layout and painting, not for a
# release.
#
#   cargo build --profile cl --target aarch64-linux-android
#
# `[profile.thin]` above is the one to use for device iteration instead: it is
# LLVM, so it does not have this bug, and it is a fraction of the cost.
[profile.cl]
inherits = "dev"
codegen-backend = "cranelift"

# The engine has to be linked in as a release archive: everything in it uses the
# static CRT (`/MT`), which is what rustc links against. A debug engine build
# uses `/MTd` and will not link. So there is no point in a Cranelift release
# profile -- the release build is dominated by the C++ link, not by rustc.
[profile.release]
codegen-units = 16
incremental = false
